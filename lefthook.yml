# Хуки гоняются локально; в CI отключены переменной LEFTHOOK=0 (проверки там свои).
pre-commit:
  parallel: true
  jobs:
    # Работа идёт в ветках под задачу (feat/…, fix/…, chore/…). dev собирает их
    # мерджем, main — релизная и наполняется только PR из dev. Коммит напрямую в
    # любую из двух — почти всегда промах, поэтому запрещаем на входе.
    # Без $( ) и без `|` в шаблоне намеренно: lefthook отдаёт run в `sh -c`, и
    # вертикальная черта внутри регулярки разбирается как конвейер (поймано 03.09:
    # `grep -qxvE "main|dev"` превращался в пайп на команду `dev`). Отсюда -e/-e.
    - name: branch
      run: git branch --show-current | grep -qxv -e main -e dev
      fail_text: "main и dev — интеграционные ветки. Заведите ветку под задачу: git switch -c feat/…"

    # Biome: формат и линт одним проходом, свой парсер — от версии TypeScript
    # не зависит. --no-errors-on-unmatched и --files-ignore-unknown нужны потому,
    # что в {staged_files} попадают файлы вне области biome.json (доки, ямлы):
    # без них хук падал бы на каждом коммите, не трогающем код.
    - name: lint
      glob: "{*.ts,*.js}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    # tsc проверяет проект целиком, per-file его гонять нельзя. Конфиги на .js
    # тоже под проверкой (tsconfig.json их включает), отсюда второй шаблон.
    - name: typecheck
      glob: "{*.ts,*.config.js}"
      run: npm run typecheck

    # Тесты не ходят в сеть, весь прогон — меньше секунды, поэтому гоняем всегда.
    - name: test
      skip_empty: false
      run: npm test

    # Мёртвый код: экспорты без импортёров, неиспользуемые файлы и зависимости.
    # Смотрит граф целиком, поэтому не per-file.
    - name: knip
      glob: "{src/**/*.ts,package.json,knip.json}"
      run: npm run lint:dead

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

# Гард на пуш. pre-commit ловит только попытку закоммитить, находясь на main,
# и не мешает `git push origin HEAD:main` из ветки задачи — а это как раз тот
# промах, который случается по невнимательности. main наполняется исключительно
# мерджем PR из dev на стороне GitHub, поэтому прямой пуш отклоняем здесь.
# В CI хуки выключены (LEFTHOOK=0), так что релизу этот гард не мешает.
pre-push:
  jobs:
    # git отдаёт pre-push строки вида "<local ref> <sha> <remote ref> <sha>"
    # через stdin, отсюда use_stdin: без него lefthook держит псевдо-TTY,
    # stdin не закрывается и `while read` виснет.
    - name: no-push-to-main
      use_stdin: true
      run: |
        while read -r _local_ref _local_sha remote_ref _remote_sha; do
          test "$remote_ref" != "refs/heads/main"
        done
      fail_text: "main наполняется только мерджем PR из dev на стороне GitHub."
