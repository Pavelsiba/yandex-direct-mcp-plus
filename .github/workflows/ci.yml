name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Единая точка для required status check: имена матричных джоб меняются
  # вместе с матрицей, имя этой — нет.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: build-test
    if: always()
    steps:
      - name: Проверить результат матрицы
        run: |
          echo "build-test: ${{ needs.build-test.result }}"
          test "${{ needs.build-test.result }}" = "success"
