name: CI

on:
  push:
    branches: [main, dev]
  # У pull_request фильтра по базе нет намеренно. Стековый PR открывается на
  # соседнюю фиче-ветку, под [main, dev] не попадает и приходит без единой
  # проверки; когда база позже переезжает на dev, workflow это не будит —
  # смена базы не событие запуска. Дальше ruleset ci-required ждёт статус
  # ci-ok, которого уже никто не поставит, и PR стоит намертво.
  pull_request:

# Джобы CI только читают код: ни пуша, ни комментариев к PR. Без этого блока
# штатный токен получает права по умолчанию из настроек репозитория.
permissions:
  contents: read

# Версии сканеров закреплены и сверяются по хешу, как mcp-publisher: latest менял бы
# вердикт CI без единой правки в репозитории. Хеш — sha256 ассета релиза на GitHub.
# Локально те же версии ставятся из winget — иначе находки расходились бы.
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

jobs:
  # Biome, tsc и сборка от версии Node не зависят: у Biome свой парсер на Rust,
  # у tsc 7 — нативный бинарник, а вывод компилятора детерминирован. Гонять их
  # по матрице — тройная плата за один и тот же ответ, поэтому одна версия.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint Markdown
        run: npm run lint:md

  # Отдельно от сборки намеренно: tsconfig.json покрывает тесты и конфиги,
  # которых нет в tsconfig.build.json. Сборка их не проверяет вообще.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Мёртвый код: экспорты без импортёров, неиспользуемые файлы и зависимости.
  # Отдельной джобой, а не шагом линта: knip смотрит граф целиком и падает по
  # другой причине — его красный не должен читаться как «формат поехал».
  knip:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Knip
        run: npm run lint:dead

  # Вся история, а не только diff PR: секрет, удалённый следующим коммитом, из
  # истории никуда не делся. --redact в скрипте — лог CI публичный.
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Gitleaks
        run: npm run lint:secrets

  # Уязвимости в зависимостях, которые уезжают в пакет. Dev-зависимости в пакет не
  # попадают, их обновляет Dependabot. Красный без правок в репозитории — штатно:
  # advisory вышел, зависимость надо поднять.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Audit
        run: npm run lint:audit

  # Корректность (actionlint, shellcheck по run: — он есть в образе ubuntu) и
  # безопасность (zizmor) workflow. Отдельно от lint: Node здесь не нужен.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf actionlint.tar.gz -C "$RUNNER_TEMP/bin" actionlint
          tar xzf zizmor.tar.gz -C "$RUNNER_TEMP/bin" zizmor
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Токен включает онлайн-аудиты zizmor: подменённые коммиты в закреплённых
      # SHA и actions с известными уязвимостями. Без него они пропускаются.
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run lint:workflows

  # Матрица нужна только тесту: он единственный исполняет код на Node.
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # Единая точка для required status check: имена матричных джоб меняются
  # вместе с матрицей, имя этой — нет.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, knip, audit, secrets, workflows, test]
    if: always()
    steps:
      - name: Проверить результаты джоб
        run: |
          echo "lint:      ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "build:     ${{ needs.build.result }}"
          echo "knip:      ${{ needs.knip.result }}"
          echo "audit:     ${{ needs.audit.result }}"
          echo "secrets:   ${{ needs.secrets.result }}"
          echo "workflows: ${{ needs.workflows.result }}"
          echo "test:      ${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.knip.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
          test "${{ needs.workflows.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
