name: Release

# Релиз идёт только с main: стартует по завершении workflow «CI» на main
# (workflow_run) и работает лишь при его успехе и событии push, то есть после
# мерджа PR из dev. Прогоны CI на pull_request отфильтрованы условием на event.
# workflow_dispatch оставлен для ручного запуска, когда релиз надо догнать.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Хуки lefthook рассчитаны на локальную работу: pre-commit запрещает коммит на
# main, а релизный коммит делается именно там. В CI проверки свои.
env:
  LEFTHOOK: "0"

jobs:
  release:
    name: Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # OIDC-токен для provenance: npm обменивает его на аттестацию Sigstore,
      # связывающую тарбол с этим репозиторием, коммитом и прогоном.
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # persist-credentials: false обязателен: иначе checkout оставляет для
      # последующих git-команд креды штатного GITHUB_TOKEN — с v6 в отдельном файле
      # под $RUNNER_TEMP, до неё заголовком http.extraheader в .git/config, — и они
      # перебивают PAT в URL, который semantic-release собирает сам
      # (lib/get-git-auth-url.js). Пуш ушёл бы от github-actions, у которого bypass
      # в рулсетах нет, и упал бы на защите main.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # registry-url не задаём даже теперь, когда публикация включена: setup-node
      # пишет собственный .npmrc, а @semantic-release/npm — свой, и они конфликтуют
      # (об этом прямо предупреждает документация плагина). Аутентификацию несёт
      # переменная NPM_TOKEN на шаге Release, файл настройки для этого не нужен.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Verify the integrity of provenance attestations
        run: npm audit signatures

      # PAT, а не github.token: пуш релизного коммита в защищённый main
      # проходит только от личности, внесённой в bypass_actors рулсетов.
      #
      # Личность релизного коммита задаётся явно. По умолчанию semantic-release
      # подписывает его semantic-release-bot, а GitHub строит список
      # контрибьюторов по полю author — и бот оседает там наравне с людьми.
      #
      # NPM_TOKEN — публикация пакета. Токен нужен типа Automation: у обычного
      # publish упирается в 2FA, подтвердить которую в CI некому. Сборку перед
      # публикацией запускает не workflow, а хук prepublishOnly в package.json —
      # npm publish вызывает его сам, поэтому отдельного шага build здесь нет.
      #
      # Диагностика на будущее: если в логе этого шага появится [secure] вместо
      # имени владельца, значит в NPM_TOKEN лежит не токен. hideSensitive маскирует
      # значения переменных, чьё имя матчит /token|password|credential|secret|private/i,
      # и 05.09.2026 так вскрылось, что в секрет попало имя пользователя.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GIT_AUTHOR_NAME: Pavelsiba
          GIT_AUTHOR_EMAIL: 105110809+Pavelsiba@users.noreply.github.com
          GIT_COMMITTER_NAME: Pavelsiba
          GIT_COMMITTER_EMAIL: 105110809+Pavelsiba@users.noreply.github.com
        run: npx semantic-release

  # Релизный цикл оставляет в main два коммита, которых нет в dev: мердж-коммит
  # PR и chore(release) от semantic-release. Без обратного мерджа дрейф копится —
  # в dev врёт package.json, а следующий PR показывает CHANGELOG как откат.
  # Отдельным job'ом, чтобы падение back-merge не красило сам релиз.
  backmerge:
    name: Back-merge main → dev
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: backmerge
      cancel-in-progress: false
    steps:
      # Тем же PAT: на dev висит ci-required, а bypass для github-actions
      # в личном репозитории добавить нельзя — API отвечает, что интеграция
      # должна принадлежать источнику рулсета.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}

      # Мерджим FETCH_HEAD, а не origin/main: устаревший remote-tracking ref
      # смерджил бы до-релизный main и молча оставил дрейф.
      # [skip ci] обязателен — пуш от PAT, в отличие от штатного токена,
      # запускает workflow, и CI прогнался бы второй раз на том же коде.
      # --no-ff обязателен по той же причине: без него merge перематывает dev,
      # своего коммита не появляется, а GitHub читает [skip ci] только в головном
      # коммите пуша. На холостом прогоне 03.09.2026 релиза не было, main ушёл вперёд
      # ровно на мердж-коммит PR — dev перемотался, и лишний CI на нём запустился.
      - name: Merge main into dev
        run: |
          # Коммитим от своего имени, а не от github-actions[bot]: иначе бот
          # оседает в контрибьюторах репозитория. Пуш всё равно идёт от PAT.
          git config user.name "Pavelsiba"
          git config user.email "105110809+Pavelsiba@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -m "chore: back-merge main в dev [skip ci]" FETCH_HEAD
          git push origin HEAD:dev
